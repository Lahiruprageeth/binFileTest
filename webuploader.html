<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ESP32-C3 Web Flasher</title>
    <script type="module">
      import "https://unpkg.com/esp-web-tools@9.0.3/dist/web/install-button.js";
    </script>
    <style>
      body {
        font-family: Arial, sans-serif;
        padding: 2rem;
        text-align: center;
        background-color: #f0f0f0;
      }
      esp-web-install-button {
        margin-top: 2rem;
      }
    </style>
  </head>
  <body>
    <h1>Flash Firmware to ESP32-C3</h1>
    <p>Click below to install firmware via WebSerial.</p>

    <!-- This button reads from manifest.json -->
    <esp-web-install-button manifest="./iott.mypressonline.com/Project/Project/manifest.json"></esp-web-install-button>
  </body>
</html>
